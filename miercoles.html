<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <form class="container">
        <div class="row">
        <label for="matricula">
            Matrícula:
        </label>
        <input 
          type="number" 
          name="matricula" 
          id="matricula">
        </div>
        <div class="row">
        <label for="calificación">
            Calificación:
        </label>
        <input 
          type="number" 
          name="calificacion"
          id="calificacion">
        </div>

        <div class="row pt-5">
            <button
              id="cancelar" 
              class="mt-5 btn theme-primary btn-solid btn-styled">
                Cancelar
            </button>
            <button 
              id="guardar"
              class="mt-5 btn theme-success btn-solid btn-styled">
                Guardar
            </button>
        </div>
    </form>

    <dialog class="dialog" id="dialog">
        <div class="dialog-header">
            <h1 class="dialog-title">Mensaje</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog"></button>
        </div>

        <div class="dialog-body"></div>

        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-primary" data-bs-dismiss="dialog">
                Aceptar
            </button>
        </div>
    </dialog>

    <script type="module" src="miercoles.js"></script>
</body>
</html>
